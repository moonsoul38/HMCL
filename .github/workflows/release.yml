name: Build & Release

on:
  workflow_dispatch:
    inputs:
      release:
        description: "构建完成后创建 GitHub Release（取消勾选则只上传 Actions Artifact）"
        type: boolean
        default: true
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: "liberica"
          java-version: "17"
          java-package: "jdk+fx"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-cleanup: never

      - name: Build with Gradle
        run: xvfb-run --auto-servernum ./gradlew clean build --no-daemon --parallel --stacktrace
        env:
          JAVA_TOOL_OPTIONS: -Djava.awt.headless=true
          MICROSOFT_AUTH_ID: ${{ secrets.MICROSOFT_AUTH_ID }}
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}

      - name: Resolve version
        id: version
        run: |
          set -euo pipefail

          jar="$(find HMCL/build/libs -maxdepth 1 -name 'HMCL-*.jar' ! -name '*-sources.jar' -print -quit)"
          if [ -z "$jar" ]; then
            echo "::error::No HMCL jar found in HMCL/build/libs"
            exit 1
          fi

          version="$(basename "$jar" .jar)"
          version="${version#HMCL-}"

          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="v${version}"
          fi

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

          echo "Built version: ${version}"
          ls -lh HMCL/build/libs/

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: HMCL-${{ steps.version.outputs.version }}
          path: HMCL/build/libs/HMCL-*
          if-no-files-found: error
          archive: false

      - name: Generate release note
        if: ${{ github.event_name == 'push' || inputs.release }}
        run: |
          set -euo pipefail

          version="${{ steps.version.outputs.version }}"
          dir="HMCL/build/libs"

          sha256() {
            awk '{print $1}' "${dir}/HMCL-${version}.$1.sha256"
          }

          {
            echo "> [!WARNING]"
            echo "> 这是**非官方构建**（个人 fork），已回退上游「在中国大陆地区禁用游戏下载功能」的改动，未使用 HMCL 官方签名。"
            echo "> 请不要就本构建的问题向 HMCL 官方反馈。"
            echo ""
            echo "- 构建提交：\`${GITHUB_SHA}\`"
            echo "- 构建时间：\`$(date -u '+%Y-%m-%d %H:%M:%S UTC')\`"
            echo ""
            echo "| 文件 | SHA-256 |"
            echo "| --- | --- |"
            for ext in exe jar sh deb; do
              echo "| [HMCL-${version}.${ext}](https://github.com/${GITHUB_REPOSITORY}/releases/download/${{ steps.version.outputs.tag }}/HMCL-${version}.${ext}) | \`$(sha256 "${ext}")\` |"
            done
            echo ""
            echo "<details>"
            echo "<summary>校验方法</summary>"
            echo ""
            echo '```bash'
            echo "sha256sum -c HMCL-${version}.jar.sha256"
            echo '```'
            echo ""
            echo "</details>"
          } > RELEASE_NOTE

          echo "RELEASE_NOTE:"
          cat RELEASE_NOTE

      - name: Publish release
        if: ${{ github.event_name == 'push' || inputs.release }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          version="${{ steps.version.outputs.version }}"
          tag="${{ steps.version.outputs.tag }}"
          dir="HMCL/build/libs"

          assets=()
          for ext in exe jar sh deb; do
            assets+=("${dir}/HMCL-${version}.${ext}")
            assets+=("${dir}/HMCL-${version}.${ext}.sha256")
          done

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release ${tag} already exists, updating assets and notes"
            gh release upload "$tag" "${assets[@]}" --clobber
            gh release edit "$tag" --notes-file RELEASE_NOTE
          else
            gh release create "$tag" "${assets[@]}" \
              --target "${GITHUB_SHA}" \
              --title "HMCL ${version} (unofficial fork)" \
              --notes-file RELEASE_NOTE \
              --prerelease
          fi

      - name: Summary
        run: |
          {
            echo "### HMCL ${{ steps.version.outputs.version }}"
            echo ""
            echo "- 提交: \`${GITHUB_SHA}\`"
            echo "- Artifact: \`HMCL-${{ steps.version.outputs.version }}\`"
            if [ "${{ github.event_name }}" = "push" ] || [ "${{ inputs.release }}" = "true" ]; then
              echo "- Release: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${{ steps.version.outputs.tag }}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
